spring.application.name=Blurr

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
# logging.level.liquibase=DEBUG
# logging.level.liquibase.parser=TRACE
# logging.level.liquibase.executor=TRACE
# logging.level.liquibase.changelog=TRACE
# logging.level.liquibase.resource=TRACE
# logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG

# Отключаем авто-создание таблиц Hibernate
spring.jpa.hibernate.ddl-auto=none

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
logging.level.org.springframework.boot.autoconfigure.h2=DEBUG

# H2 DataSource
spring.datasource.url=jdbc:h2:file:~/testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SwaggerUi
spring.springdoc.swagger-ui.path=/swagger-ui.html
spring.springdoc.swagger-ui.operationsSorter=method

server.port=8081